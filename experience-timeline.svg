<svg viewBox="0 0 900 670" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Shoaib Ali — Experience timeline</title>
  <desc id="d">Two internships: WAPDA AJK (Desktop &amp; Web Development) and NTC MUST Mirpur (Backend Development).</desc>

  <defs>
    <linearGradient id="cardFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0709"/>
      <stop offset="0.55" stop-color="#0f0b10"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B0000"/>
      <stop offset="0.5" stop-color="#C9A96E"/>
      <stop offset="1" stop-color="#3D0000"/>
    </linearGradient>

    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#C9A96E" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F3E3B8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#C9A96E" stop-opacity="0"/>
      <animate attributeName="x1" values="-300;900" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1200" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A96E" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#C9A96E"/>
      <stop offset="0.85" stop-color="#8B0000"/>
      <stop offset="1" stop-color="#8B0000" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0" stop-color="#C9A96E" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C9A96E" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <style>
      .org   { font: 700 27px Georgia, 'Times New Roman', serif; fill: #C9A96E; letter-spacing: 1.5px; }
      .role  { font: 400 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e9dfc7; }
      .pill  { font: 600 10px 'SFMono-Regular', Consolas, 'Courier New', monospace; fill: #C9A96E; letter-spacing: 1.2px; }
      .bul   { font: 400 13.5px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; }
      .hl { font-weight: 700; fill: #F3E3B8; }
      .chip  { font: 600 11px 'SFMono-Regular', Consolas, 'Courier New', monospace; fill: #e9dfc7; }
      .mark  { font: 400 12px 'Segoe UI', sans-serif; fill: #8B0000; }
      .big   { font: 700 130px Georgia, serif; fill: #C9A96E; opacity: 0.06; }
      .tag   { font: 600 10px 'SFMono-Regular', Consolas, monospace; fill: #7d8590; letter-spacing: 3px; }
    </style>
  </defs>

  <!-- ═════════ TIMELINE SPINE ═════════ -->
  <line x1="46" y1="10" x2="46" y2="660" stroke="url(#spine)" stroke-width="2"/>
  <line x1="46" y1="10" x2="46" y2="660" stroke="#C9A96E" stroke-width="2" stroke-dasharray="2 14" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="32;0" dur="2.4s" repeatCount="indefinite"/>
  </line>

  <!-- ═════════ ENTRY 01 : WAPDA AJK ═════════ -->
  <g>
    <!-- node -->
    <circle cx="46" cy="72" r="26" fill="url(#glow)">
      <animate attributeName="r" values="18;30;18" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="46" cy="72" r="9" fill="#0D1117" stroke="#C9A96E" stroke-width="2"/>
    <circle cx="46" cy="72" r="4" fill="#C9A96E"/>
    <line x1="56" y1="72" x2="92" y2="72" stroke="#C9A96E" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.7"/>

    <!-- card glow + body -->
    <rect x="92" y="30" width="790" height="300" rx="18" fill="#8B0000" opacity="0.18" filter="url(#soft)"/>
    <rect x="92" y="30" width="790" height="300" rx="18" fill="url(#cardFill)" stroke="url(#border)" stroke-width="1.5"/>
    <rect x="92" y="30" width="790" height="300" rx="18" fill="none" stroke="url(#shimmer)" stroke-width="2"/>
    <rect x="92" y="52" width="5" height="256" rx="2.5" fill="#C9A96E"/>
    <text x="862" y="190" text-anchor="end" class="big">01</text>

    <!-- header -->
    <text x="124" y="64" class="tag">◈ INTERNSHIP · 01</text>
    <text x="124" y="96" class="org">WAPDA AJK</text>
    <text x="124" y="120" class="role">Desktop &amp; Web Development Intern</text>

    <!-- status pill -->
    <rect x="606" y="52" width="256" height="28" rx="14" fill="#C9A96E" fill-opacity="0.08" stroke="#C9A96E" stroke-opacity="0.6"/>
    <circle cx="626" cy="66" r="4" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="638" y="70" class="pill">IN ACTIVE OPERATIONAL USE</text>

    <line x1="124" y1="140" x2="850" y2="140" stroke="url(#border)" stroke-width="1" opacity="0.5"/>

    <!-- bullets -->
    <g>
      <text x="124" y="170" class="mark">◈</text>
      <text x="146" y="170" class="bul">Built a <tspan class="hl">full-scale fault &amp; issue management system</tspan> to digitize reporting across departments</text>
      <text x="124" y="198" class="mark">◈</text>
      <text x="146" y="198" class="bul"><tspan class="hl">C# desktop app</tspan> for field-level fault logging and real-time issue tracking</text>
      <text x="124" y="226" class="mark">◈</text>
      <text x="146" y="226" class="bul"><tspan class="hl">Web interface</tspan> giving supervisors centralized visibility into issues and resolution progress</text>
      <text x="124" y="254" class="mark">◈</text>
      <text x="146" y="254" class="bul"><tspan class="hl">Automated fault escalation</tspan> to cut resolution turnaround time</text>
      <text x="124" y="282" class="mark">◈</text>
      <text x="146" y="282" class="bul"><tspan class="hl">Deployed both</tspan> the desktop application and web platform into active operational use</text>
    </g>

    <!-- chips -->
    <g transform="translate(124,296)">
      <rect width="46" height="22" rx="11" fill="#8B0000" fill-opacity="0.35" stroke="#8B0000"/>
      <text x="23" y="15" text-anchor="middle" class="chip">C#</text>
      <rect x="56" width="104" height="22" rx="11" fill="#8B0000" fill-opacity="0.35" stroke="#8B0000"/>
      <text x="108" y="15" text-anchor="middle" class="chip">Desktop App</text>
      <rect x="170" width="112" height="22" rx="11" fill="#8B0000" fill-opacity="0.35" stroke="#8B0000"/>
      <text x="226" y="15" text-anchor="middle" class="chip">Web Platform</text>
    </g>
  </g>

  <!-- ═════════ ENTRY 02 : NTC MUST ═════════ -->
  <g>
    <circle cx="46" cy="402" r="26" fill="url(#glow)">
      <animate attributeName="r" values="18;30;18" dur="3s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="3s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="46" cy="402" r="9" fill="#0D1117" stroke="#C9A96E" stroke-width="2"/>
    <circle cx="46" cy="402" r="4" fill="#C9A96E"/>
    <line x1="56" y1="402" x2="92" y2="402" stroke="#C9A96E" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.7"/>

    <rect x="92" y="360" width="790" height="290" rx="18" fill="#8B0000" opacity="0.18" filter="url(#soft)"/>
    <rect x="92" y="360" width="790" height="290" rx="18" fill="url(#cardFill)" stroke="url(#border)" stroke-width="1.5"/>
    <rect x="92" y="360" width="790" height="290" rx="18" fill="none" stroke="url(#shimmer)" stroke-width="2">
      <animate attributeName="opacity" values="0;0;1;1;0" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="92" y="382" width="5" height="246" rx="2.5" fill="#8B0000"/>
    <text x="862" y="520" text-anchor="end" class="big">02</text>

    <text x="124" y="394" class="tag">◈ INTERNSHIP · 02</text>
    <text x="124" y="426" class="org">NTC MUST, MIRPUR</text>
    <text x="124" y="450" class="role">Backend Development Intern</text>

    <rect x="752" y="382" width="110" height="28" rx="14" fill="#C9A96E" fill-opacity="0.08" stroke="#C9A96E" stroke-opacity="0.6"/>
    <text x="807" y="400" text-anchor="middle" class="pill">8 WEEKS</text>

    <line x1="124" y1="470" x2="850" y2="470" stroke="url(#border)" stroke-width="1" opacity="0.5"/>

    <g>
      <text x="124" y="500" class="mark">◈</text>
      <text x="146" y="500" class="bul">Developed <tspan class="hl">RESTful APIs</tspan> with Express.js and PHP; collaborated on database integration</text>
      <text x="124" y="528" class="mark">◈</text>
      <text x="146" y="528" class="bul">Built a <tspan class="hl">School Campus Management System</tspan>: student records, attendance and grades</text>
      <text x="124" y="556" class="mark">◈</text>
      <text x="146" y="556" class="bul">Architected a <tspan class="hl">normalized MySQL schema</tspan> for student, faculty and admin data, built to scale</text>
      <text x="124" y="584" class="mark">◈</text>
      <text x="146" y="584" class="bul"><tspan class="hl">Responsive, role-based admin panel</tspan> for enrollment, academic records and reporting</text>
    </g>

    <g transform="translate(124,604)">
      <rect width="92" height="22" rx="11" fill="#8B0000" fill-opacity="0.35" stroke="#8B0000"/>
      <text x="46" y="15" text-anchor="middle" class="chip">Express.js</text>
      <rect x="102" width="56" height="22" rx="11" fill="#8B0000" fill-opacity="0.35" stroke="#8B0000"/>
      <text x="130" y="15" text-anchor="middle" class="chip">PHP</text>
      <rect x="168" width="66" height="22" rx="11" fill="#8B0000" fill-opacity="0.35" stroke="#8B0000"/>
      <text x="201" y="15" text-anchor="middle" class="chip">MySQL</text>
      <rect x="244" width="108" height="22" rx="11" fill="#8B0000" fill-opacity="0.35" stroke="#8B0000"/>
      <text x="298" y="15" text-anchor="middle" class="chip">Tailwind CSS</text>
    </g>
  </g>
</svg>
